<!-- exo13 (template cherche automatiquement par la ListView) -->
<h1>Liste des livres</h1>

<!-- exo14 (livres au lieu de object_list) -->
<ul>
    {% for livre in livres %}
        <li><a href="{% url 'detail_livre' livre.isbn %}">{{ livre.titre }}</a> par {{ livre.auteur }}</li>
    {% empty %}
        <li>Aucun livre</li>
    {% endfor %}
</ul>
